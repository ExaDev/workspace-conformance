name: CI
on:
  pull_request:
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - 'docs/**'
  docs:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.docs == 'true'
        run: echo docs
  gated:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo gated
  required-checks:
    needs: [changes, docs, gated]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo done
