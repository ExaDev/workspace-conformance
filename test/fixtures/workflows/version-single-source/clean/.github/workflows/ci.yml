name: CI
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version-file: .tool-versions
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
  matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
