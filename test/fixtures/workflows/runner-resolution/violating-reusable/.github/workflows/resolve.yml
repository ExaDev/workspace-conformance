name: Resolve runner
on:
  workflow_call:
    outputs:
      runner:
        description: Runner labels as JSON
        value: ${{ jobs.pick.outputs.runner }}
jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.choose.outputs.runner }}
    steps:
      - id: choose
        run: echo 'runner=["fleet"]' >> "$GITHUB_OUTPUT"
