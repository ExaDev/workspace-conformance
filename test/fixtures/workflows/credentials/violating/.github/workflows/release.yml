name: Release
on: push
permissions:
  contents: read
jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
  attest-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/attest@v2
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org
      - run: npm publish
